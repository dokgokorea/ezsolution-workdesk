<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직원 계정 · 이지솔루션</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f6;color:#16332f;font:16px/1.55 system-ui,sans-serif}main{max-width:1040px;margin:5vh auto;padding:20px}h1{font-size:1.7rem;margin:.45em 0}h2{font-size:1.25rem}section{background:white;border:1px solid #ccd9d6;border-radius:12px;padding:20px;margin-bottom:16px}button,a,input,select{font:inherit}button,a{cursor:pointer}button{color:white;background:#08695f;border:0;padding:9px 14px;border-radius:6px}input,select{max-width:100%;padding:8px;border:1px solid #91afa9;border-radius:5px}form,label{display:grid;gap:8px}form{gap:14px;max-width:440px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}.table{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:9px;border-bottom:1px solid #dce6e4}p[role=status]{color:#8d472a}a{color:#005b52}</style><main><small>이지솔루션 · 현장 운영관리</small><div class="row"><h1>직원 계정</h1><a href="/">업무 화면으로</a></div><section><h2>계정 추가</h2><form id="new"><label>아이디<input name="login" maxlength="80" required autocomplete="off"></label><label>비밀번호 (12자 이상)<input type="password" name="pw" minlength="12" required autocomplete="new-password"></label><label>역할<select name="role"></select></label><button>계정 추가</button></form></section><section><h2>계정 변경</h2><form id="edit"><label>직원<select name="login" required></select></label><label>역할<select name="role"></select></label><label>사용 여부<select name="enabled"><option value="1">사용</option><option value="0">사용 중지</option></select></label><label>새 비밀번호 (변경할 때만)<input name="pw" type="password" minlength="12" autocomplete="new-password"></label><button>변경 저장</button></form><p>현장관리자와 통역은 근태만 조회합니다. 역할이나 비밀번호를 바꾸면 해당 직원은 다시 로그인해야 합니다.</p></section><p id="message" role="status"></p></main><script>const $=s=>document.querySelector(s);
async function request(path,body){const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};const res=await fetch(path,{...opt,cache:'no-store'});const data=await res.json();if(!res.ok){if(res.status===401&&path!=='/api/login')location.replace('/');throw Error(data.error||'요청 실패');}return data;}
function report(e){$('#message').textContent=e.message;}
function submit(selector,fn){$(selector).onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{$('#message').textContent='';await fn(Object.fromEntries(new FormData(f)));}catch(e){report(e);}finally{b.disabled=false;}};}
if($('#logout'))$('#logout').onclick=async()=>{try{await request('/api/logout',{});location.replace('/');}catch(e){report(e);}};
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});


const roles=['팀장','사무실 직원','현장관리자','통역'];for(const select of document.querySelectorAll('[name=role]'))for(const role of roles)select.add(new Option(role,role));$('#new [name=role]').value='현장관리자';
let users=[];const pick=$('#edit [name=login]');
function show(){const u=users.find(x=>x.login===pick.value);if(u){$('#edit [name=role]').value=u.role;$('#edit [name=enabled]').value=String(u.enabled);}}
async function refresh(){users=await request('/api/users');pick.replaceChildren();for(const u of users)pick.add(new Option(u.login+' · '+u.role,u.login));show();}
pick.onchange=show;refresh().catch(report);
submit('#new',async f=>{await request('/api/users',f);$('#new').reset();$('#new [name=role]').value='현장관리자';await refresh();$('#message').textContent='계정을 추가했습니다.';});
submit('#edit',async f=>{await request('/api/user-settings',{...f,enabled:f.enabled==='1'});$('#edit [name=pw]').value='';await refresh();$('#message').textContent='변경 사항을 저장했습니다.';});</script></html>
