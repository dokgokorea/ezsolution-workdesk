</style><aside><strong>이지솔루션</strong><small>익산 현장 운영</small><nav id="nav"></nav></aside><main><header><div><div class="status" id="mode"></div><h1 id="title"></h1></div><div id="bar"></div></header><div id="notify" role="status" class="msg"></div><article id="view"></article></main><dialog id="dlg"></dialog><script>const empty=()=>({staff:[],days:[],charges:[],credits:[],receipts:[],bonuses:[],locks:[],operating:[]});
const time=v=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(v))throw Error('시각을 확인하세요.');return Number(v.slice(0,2))*60+Number(v.slice(3));};
const overlap=(a,b,c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c));
const won=n=>{if(!Number.isSafeInteger(n)||n<0)throw Error('금액은 0 이상의 정수로 입력하세요.');return n;};
function calculate(x){
const s=time(x.start),e=time(x.end),b=time(x.bs),c=time(x.be);
if(e<=s||b<s||c<b||c>e||e-s-(c-b)<=0)throw Error('기본근무와 휴게 시각을 확인하세요. 이 버전은 당일 주간 근무를 계산합니다.');
const minutes=(a,z)=>Math.max(0,z-a-overlap(a,z,b,c)),base=minutes(s,e);
let a=x.absent?s:time(x.arrive),z=x.absent?s:time(x.leave);
if(!x.absent&&z<=a)throw Error('퇴근은 출근보다 늦어야 합니다.');if(!Number.isInteger(x.ot)||x.ot<0||x.ot>1440||(x.absent&&x.ot))throw Error('잔업 분을 확인하세요.');
let worked=x.absent?0:minutes(Math.min(e,Math.max(a,s)),Math.max(s,Math.min(z,e)));
let basic=Math.round(won(x.rate)*worked/base),overtime=Math.round(won(x.otRate)*x.ot/60);
let late=x.absent?0:minutes(s,Math.min(e,Math.max(a,s))),early=x.absent?0:minutes(Math.max(s,Math.min(z,e)),e);
return {base,worked,late,early,basic,overtime,loss:x.rate-basic,bill:Math.round(x.bill*worked/base)+Math.round(x.otBill*x.ot/60),gross:basic+overtime};
}
function payroll(db,id,month){
const rows=db.days.filter(x=>x.emp===id&&x.date.slice(0,7)===month);
const add=(xs,f)=>xs.reduce((a,x)=>a+f(x),0);const m=xs=>xs.filter(x=>x.emp===id&&x.month===month);
const basic=add(rows,x=>calculate(x).basic),ot=add(rows,x=>calculate(x).overtime),bonus=add(m(db.bonuses),x=>x.amount);
const deductions=add(m(db.credits),x=>x.amount),sent=add(m(db.receipts),x=>x.amount),gross=basic+ot+bonus;
return {rows,worked:add(rows,x=>calculate(x).worked),late:add(rows,x=>calculate(x).late),early:add(rows,x=>calculate(x).early),scheduled:add(rows,x=>x.rate),loss:add(rows,x=>calculate(x).loss),basic,ot,bonus,gross,deductions,net:gross-deductions,sent,due:gross-deductions-sent,bill:add(rows,x=>calculate(x).bill)};

const outstanding=(db,id)=>db.charges.find(x=>x.id===id).amount-db.credits.filter(x=>x.charge===id).reduce((a,x)=>a+x.amount,0);
function applyCredit(db,charge,month,amount,basis){
const ch=db.charges.find(x=>x.id===charge);if(!ch||!basis.trim()||!won(amount)||amount>outstanding(db,charge))throw Error('근거와 남은 금액을 확인하세요.');
if(month<ch.date.slice(0,7)||db.locks.includes(ch.emp+'|'+month))throw Error('비용 발생월 이후의 미마감 월을 선택하세요.');

}
</script><script>const catalogTypes = {
  fleet: {label:'차량', edit:'vehicleEdit', key:'vehicle', cost:'차량 '},
  rooms: {label:'호실', edit:'roomEdit', key:'dorm', cost:'숙소 '},
  groups: {label:'공정', edit:'groupEdit', key:'group'}
};
const activeItems = items => items.filter(item => !item.archivedOn);
const listedOn = (items,date) => items.filter(item => !item.archivedOn || date < item.archivedOn);

function migrateGroups(data) {
  if (Array.isArray(data.groups)) return;
  const names = new Set(processes);
  for (const e of data.staff) {
    for (const name of [e.firstGroup,e.group,...(e.assignments||[]).map(a=>a.group)]) if (name) names.add(name);
  }
  for (const row of data.days) if (row.group) names.add(row.group);
  data.groups = [...names].map(name=>({id:crypto.randomUUID(),name}));
}

function storeItem(data,type,id,rawName,values={}) {
  const items=data[type], item=id?items.find(it=>it.id===id):null, name=rawName.trim();
  if (id && !item) throw Error('항목을 다시 선택하세요.');
  if (!name || items.some(it=>it.id!==id && it.name===name)) throw Error('빈 이름과 중복된 이름은 사용할 수 없습니다. 사용 종료 목록도 확인하세요.');
  if (type==='groups' && name==='공정 미분류') throw Error('공정 미분류는 공정이 비어 있는 직원을 표시하는 이름입니다.');
  if (item && item.name!==name) {
    const old=item.name;
    if (type==='groups') {
      for (const e of data.staff) {
        if (e.group===old) e.group=name;
        if (e.firstGroup===old) e.firstGroup=name;
        for (const a of e.assignments||[]) if (a.group===old) a.group=name;
      }
      for (const row of data.days) if (row.group===old) row.group=name;
    }
    if (type==='rooms') {
      for (const e of data.staff) {
        if (e.dorm===old) e.dorm=name;
        if (e.logBase?.dorm===old) e.logBase.dorm=name;
        for (const a of e.logChanges||[]) if (a.key==='dorm' && a.value===old) a.value=name;
      }
    }
    const prefix=catalogTypes[type].cost;
    if (prefix) for (const row of data.operating) if (row.kind.startsWith(prefix) && row.unit===old) row.unit=name;
  }
  if (item) Object.assign(item,values,{name});
  else items.push({id:uid(),...values,name});
}

function retirementState(data,type,item) {
  const {key,cost}=catalogTypes[type], value=type==='fleet'?item.id:item.name;
  let used=type==='groups'?data.days.some(x=>x.group===value):
    data.operating.some(x=>x.kind.startsWith(cost)&&x.unit===item.name);
  if (type==='fleet' && data.boardings.some(x=>x.vehicle===value)) used=true;
  for (const e of data.staff) {
    const group=type==='groups', events=group?(e.assignments||[]).map(a=>({date:a.from,value:a.group})):(e.logChanges||[]).filter(a=>a.key===key);
    const base=group?e.firstGroup:e.logBase?.[key];
    if (base===value || e[key]===value || events.some(a=>a.value===value)) used=true;
    const start=e.hire>today?e.hire:today;
    const dates=[start,...events.map(a=>a.date).filter(date=>date>start)];
    if (dates.some(date=>(type==='rooms'||employedOn(e,date)) && (group?assignedGroup(e,date):fieldAt(e,key,date))===value)) return 'assigned';
  }
  return used?'archive':'delete';
}

function itemAction(type,item) {

function catalogPage() {

function retireItem(ref,restore) {

const fleetNames=['버스 1호','스타리아 1호','스타리아 2호','자차 1호','자차 2호'];
const baseFleet=()=>fleetNames.map((name,i)=>({id:'vehicle-'+(i+1),name,seats:null,driver:'',plate:''}));

  if(!Array.isArray(d.fleet))d.fleet=baseFleet();

  if(!Array.isArray(d.boardings))d.boardings=[];

function fieldAt(e,key,date){
  let value=e.logBase&&key in e.logBase?e.logBase[key]:e[key]||'';
  const events=(e.logChanges||[]).filter(x=>x.key===key&&x.date<=date).sort((a,b)=>a.date.localeCompare(b.date));

}
function setField(e,key,date,value){

const employedOn=(e,date)=>e.hire<=date&&(!e.exit||date<=e.exit);
const passengerSeats=v=>Number.isInteger(v.seats)?v.seats-1:null;

  const dow=String(new Date(date+'T12:00:00').getDay());

    const boarded=data.boardings.some(x=>x.date===date&&x.emp===e.id&&x.vehicle===vehicle.id);

 const filter=area==='차량'?'차량 ':'숙소 ';

 return '<section><div class="line"><h2>'+H(area)+' 비용 내역</h2>'+inp('month','비용 귀속월','month',month)+btn(area==='차량'?'vehicleCost':'roomCost','비용 등록')+'</div>'+tbl(['귀속일','구분','대상','금액',''],items.map(r=>[H(r.date),H(r.kind),H(r.unit),money(r.amount),btn('opEdit','수정','',r.id)]))+'</section>';

const costKinds=['숙소 월세','숙소 관리비','숙소 기타비','숙소 직접 수납','차량 유류비','차량 정비비','차량 보험·임차료','차량 기타비','기타 운영비','매출 추가','매출 차감'];
function processCounts(data,date){
  const buckets=new Map((data.groups?listedOn(data.groups,date).map(g=>g.name):processes).map(n=>[n,[0,0,0,0,0,0,0,0]]));
  const bucket=n=>{const name=(n||'').trim()||'공정 미분류';if(!buckets.has(name))buckets.set(name,[0,0,0,0,0,0,0,0]);return buckets.get(name);};
  const inc=(name,sex,start)=>{const b=bucket(name);b[start]++;b[start+(sex==='남'?1:sex==='여'?2:3)]++;};
  const staff=new Map(data.staff.map(e=>[e.id,e]));
  for(const e of data.staff)if(e.hire<=date&&(!e.exit||date<=e.exit))inc(assignedGroup(e,date),e.sex,0);
  for(const x of data.days)if(x.date===date&&!x.absent)inc(x.group,x.sex||staff.get(x.emp)?.sex,4);
  return [...buckets].map(([name,counts])=>[name,...counts]);
}

function monthProfit(data,period){
  const x={bill:0,adjust:0,wages:0,bonus:0,housing:0,recovery:0,direct:0,vehicle:0,other:0};
  const charges=new Map(data.charges.map(c=>[c.id,c]));
  for(const row of data.days.filter(r=>r.date.startsWith(period+'-'))){const d=calculate(row);x.bill+=d.bill;x.wages+=d.gross;}
  for(const row of data.bonuses)if(row.month===period)x.bonus+=row.amount;
  for(const row of data.credits)if(row.month===period&&charges.get(row.charge)?.type==='숙소비')x.recovery+=row.amount;
  for(const r of (data.operating||[]).filter(r=>r.date.startsWith(period+'-'))){
    if(r.kind==='숙소 직접 수납')x.direct+=r.amount;
    else if(r.kind.startsWith('숙소 '))x.housing+=r.amount;
    else if(r.kind.startsWith('차량 '))x.vehicle+=r.amount;
    else if(r.kind==='매출 추가')x.adjust+=r.amount;
    else if(r.kind==='매출 차감')x.adjust-=r.amount;
    else x.other+=r.amount;
  }
  x.revenue=x.bill+x.adjust;x.labor=x.wages+x.bonus;x.netHousing=x.housing-x.recovery-x.direct;
  x.profit=x.revenue-x.labor-x.netHousing-x.vehicle-x.other;return x;
}
function profitRows(x){return [['근태 청구액',x.bill],['매출 조정',x.adjust],['예상 매출',x.revenue],['세전 인건비 (수당 포함)',x.labor],['숙소 지출',x.housing],['숙소비 급여 회수',x.recovery],['숙소비 직접 수납',x.direct],['숙소 순부담',x.netHousing],['차량비',x.vehicle],['기타 운영비',x.other],['예상 영업손익',x.profit]];}

let vaultFolder=null,backupState='별도 폴더 미연결',folderDB=null;
async function backupSettings(){
 if(folderDB)return folderDB;
 folderDB=await new Promise((resolve,reject)=>{const req=indexedDB.open('ez-workdesk-backup',1);req.onupgradeneeded=()=>req.result.createObjectStore('folders');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
 return folderDB;
}
async function rememberFolder(handle){
 const conn=await backupSettings();await new Promise((resolve,reject)=>{const tx=conn.transaction('folders','readwrite');if(handle)tx.objectStore('folders').put(handle,salt);else tx.objectStore('folders').delete(salt);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error);tx.onerror=()=>reject(tx.error);});
}
async function recallFolder(){
 vaultFolder=null;backupState='별도 폴더 미연결';if(!globalThis.indexedDB)return;
 try{const conn=await backupSettings();const h=await new Promise((ok,fail)=>{const q=conn.transaction('folders').objectStore('folders').get(salt);q.onsuccess=()=>ok(q.result);q.onerror=()=>fail(q.error);});
 if(h){vaultFolder=h;backupState=await h.queryPermission({mode:'readwrite'})==='granted'?'자동 백업 폴더 연결됨':'자동 백업 권한 재연결 필요';}}catch{backupState='백업 폴더를 다시 선택하세요';}
}
async function writeFolderBackup(raw){
 if(!vaultFolder)return;

function monthlySheets(data, period, employeeId) {
  const include = id => !employeeId || id === employeeId;
  const people = new Map(data.staff.map(s => [s.id, s]));
  const identity = id => [people.get(id)?.code || '', people.get(id)?.name || ''];
  const byMonth = rows => rows.filter(x => include(x.emp) && x.month === period);
  const days = data.days.filter(x => include(x.emp) && x.date.startsWith(period+'-'))
    .slice().sort((a,b) => a.date.localeCompare(b.date) || String(identity(a.emp)[0]).localeCompare(String(identity(b.emp)[0])));
  const credits = byMonth(data.credits), bonuses = byMonth(data.bonuses), receipts = byMonth(data.receipts);
  const employees = [...new Set([...days,...credits,...bonuses,...receipts].map(x => x.emp))];
  const summary = employees.map(id => {
    const p = payroll(data,id,period);
    return [period,...identity(id),data.locks.includes(id+'|'+period)?'확정':'예상',p.rows.filter(x=>!x.absent).length,p.worked,p.late,p.early,p.basic,p.ot,p.bonus,p.gross,p.deductions,p.net,p.sent,p.due];
  });
  const accounts = new Map();
  const work = days.map(x => {
    const c=calculate(x), k=JSON.stringify([x.client,x.group]);
    const a=accounts.get(k)||[x.client,x.group,0,0,0];a[2]+=Number(!x.absent);a[3]+=c.bill;a[4]+=c.gross;accounts.set(k,a);
    return [x.date,...identity(x.emp),x.client,x.group,x.absent?'결근':[c.late?'지각':'',c.early?'조퇴':''].filter(Boolean).join('·')||'정상',x.absent?'':x.arrive,x.absent?'':x.leave,c.base,c.worked,c.late,c.early,x.ot,x.rate,c.loss,c.basic,c.overtime,c.gross,c.bill];
  });
  const costs = data.charges.filter(x => include(x.emp) && x.date.slice(0,7)<=period).map(ch => {
    const events = data.credits.filter(c => c.charge===ch.id);
    const previous=events.filter(x=>x.month<period).reduce((n,x)=>n+x.amount,0);
    const now=events.filter(x=>x.month===period).reduce((n,x)=>n+x.amount,0);
    if(ch.date.slice(0,7)<period && previous===ch.amount && !now) return null;
    return [...identity(ch.emp),ch.date,ch.type,ch.amount,previous,now,ch.amount-previous-now];
  }).filter(Boolean);
  return [
    ['월 급여',['귀속월','사번','성명','상태','출근일수','기본 실근무(분)','지각(분)','조퇴(분)','실근무 기본급','잔업급','수당','총지급액','공제액','실입금 예정액','누적 실송금액','남은 송금액'],summary],
    ['일별 근태',['근무일','사번','성명','거래처','파트','근태','출근','퇴근','기준(분)','기본 실근무(분)','지각(분)','조퇴(분)','잔업(분)','기본 일당','미근무시간 상당액','기본급','잔업급','근무액','예상 청구액'],work],
    ['비용과 공제',['사번','성명','발생일','항목','발생액','전월까지 회수','당월 급여 공제','해당 월말 잔액'],costs],
    ['수당',['귀속월','사번','성명','수당명','금액'],bonuses.map(x=>[period,...identity(x.emp),x.note,x.amount])],
    ['이체내역',['귀속월','사번','성명','실제 이체일','이체액'],receipts.map(x=>[period,...identity(x.emp),x.date,x.amount])],
    ['거래처 정산',['거래처','파트','투입 인일','근태 기준 예상 청구액','근태 지급액'],[...accounts.values()]]
  ];
}

    for(const [pos,size,value] of fields){if(size===2)v.setUint16(pos,value,true);else v.setUint32(pos,value,true);}return a;};

if(a==='staff')return staffEdit(id);
if(a==='dayEdit')return dayEdit(id);
if(a==='addDay'){let opts=db.staff.filter(active).map(e=>[e.id,e.name+' · '+e.code]);if(!opts.length)throw Error('재직 직원을 먼저 등록하세요.');return dialog('추가 근무',select('id','직원',opts),async f=>{setTimeout(()=>dayEdit(f.id),0);},'근태 입력');}
if(a==='bulk'){const dow=String(new Date(day+'T12:00:00').getDay());let list=db.staff.filter(e=>active(e)&&e.week.includes(dow)&&!db.days.some(x=>x.emp===e.id&&x.date===day));if(!list.length)throw Error('미확인 예정자가 없습니다.');return dialog('정상 출근 일괄 확정','<p>'+H(day)+' · '+list.length+'명</p><p>'+H(list.map(x=>x.name).join(', '))+'</p>',async()=>change(d=>{for(let e of list){if(lock(e.id,day.slice(0,7)))throw Error('확정된 급여월이 포함됐습니다.');let row=snapshot(e,day);calculate(row);d.days.push(row);}}),'출근 확정');}
guard();
if(a==='charge')return dialog(label(who)+' · 비용 발생',select('type','항목',['숙소비','병원비','가불금','기타','원천공제'].map(x=>[x,x]))+inp('date','발생일','date',day,'required')+inp('amount','발생액 (원)','number','','min="1" step="1" required')+inp('note','내용 또는 증빙 참조','text','','required')+'<p class="tip">등록만으로는 입금 예정액이 줄지 않습니다. 지각·조퇴는 근태에서만 처리하세요.</p>',async f=>change(d=>d.charges.push({...f,id:uid(),emp:who,amount:won(+f.amount)})));
if(a==='credit'){let ch=db.charges.find(x=>x.id===id);return dialog(ch.type+' · 급여 반영',inp('month','급여 귀속월','month',month,'required')+inp('amount','이번 달 반영액 (원)','number',outstanding(db,id),'min="1" step="1" required')+inp('basis','확인한 공제 근거·증빙 참조','text','','required')+'<p>남은 금액 '+money(outstanding(db,id))+'</p>',async f=>change(d=>applyCredit(d,id,f.month,+f.amount,f.basis)));}
if(a==='undoCredit'){let x=db.credits.find(y=>y.id===id);if(lock(x.emp,x.month))throw Error('먼저 귀속월 급여 마감을 해제하세요.');return dialog('공제 반영 취소','<p>'+H(x.month)+' '+money(x.amount)+'을 미회수 잔액으로 되돌립니다.</p>',async()=>change(d=>{d.credits=d.credits.filter(y=>y.id!==id);}), '취소 반영');}
if(a==='bonus'){if(lock(who,month))throw Error('확정된 월입니다.');return dialog('수당 추가',inp('note','수당명','text','','required')+inp('amount','금액 (원)','number','','min="1" step="1" required'),async f=>change(d=>d.bonuses.push({...f,id:uid(),emp:who,month,amount:won(+f.amount)})));}
if(a==='close'){let closed=lock(who,month),p=payroll(db,who,month);if(!closed&&(!p.rows.length&&!p.bonus||p.net<0||p.due<0))throw Error('근무·수당 및 차액을 확인하세요.');return dialog(closed?'급여 마감 해제':'급여 확정','<p>'+H(label(who))+' · '+H(month)+' · 실입금 예정 '+money(p.net)+'</p>',async()=>change(d=>{let k=who+'|'+month;d.locks=closed?d.locks.filter(x=>x!==k):[...d.locks,k];}),closed?'해제':'확정');}
if(a==='receipt'){if(!lock(who,month))throw Error('급여 확정 후 실제 이체를 기록하세요.');let max=payroll(db,who,month).due;if(max<=0)throw Error('남은 송금액이 없습니다.');return dialog('실제 이체 기록',inp('date','실제 이체일','date',today,'required')+inp('amount','실제 송금액 (원)','number',max,'min="1" max="'+max+'" required'),async f=>change(d=>{if(won(+f.amount)>max)throw Error('남은 금액을 초과합니다.');d.receipts.push({id:uid(),emp:who,month,date:f.date,amount:+f.amount});}));}
if(a==='print')return window.print();
}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button[data-a]');if(!b||busy)return;try{msg('');await action(b.dataset.a,b.dataset.id);}catch(e){msg(e.message);}});
$('#view').addEventListener('change',ev=>{let f=ev.target;if(f.name==='day'&&f.value)day=f.value;if(f.name==='month'&&f.value)month=f.value;if(f.name==='who')who=f.value;render();});render();loadShared().catch(e=>{$('#title').textContent='자료를 열 수 없습니다';msg(e.message+' 페이지를 새로고침하세요.');});
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
</script></html>
