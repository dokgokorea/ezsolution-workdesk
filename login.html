<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 이지솔루션</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f6;color:#16332f;font:16px/1.55 system-ui,sans-serif}main{max-width:1040px;margin:5vh auto;padding:20px}h1{font-size:1.7rem;margin:.45em 0}h2{font-size:1.25rem}section{background:white;border:1px solid #ccd9d6;border-radius:12px;padding:20px;margin-bottom:16px}button,a,input,select{font:inherit}button,a{cursor:pointer}button{color:white;background:#08695f;border:0;padding:9px 14px;border-radius:6px}input,select{max-width:100%;padding:8px;border:1px solid #91afa9;border-radius:5px}form,label{display:grid;gap:8px}form{gap:14px;max-width:440px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}.table{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:9px;border-bottom:1px solid #dce6e4}p[role=status]{color:#8d472a}a{color:#005b52}</style><main><small>이지솔루션 · 현장 운영관리</small><section style="max-width:460px;margin:12px auto"><h1>직원 로그인</h1><form id="login"><label>아이디<input name="login" required autocomplete="username"></label><label>비밀번호<input type="password" name="pw" required autocomplete="current-password"></label><button>로그인</button></form></section><p id="message" role="status"></p></main><script>const $=s=>document.querySelector(s);
async function request(path,body){const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};const res=await fetch(path,{...opt,cache:'no-store'});const data=await res.json();if(!res.ok){if(res.status===401&&path!=='/api/login')location.replace('/');throw Error(data.error||'요청 실패');}return data;}
function report(e){$('#message').textContent=e.message;}
function submit(selector,fn){$(selector).onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{$('#message').textContent='';await fn(Object.fromEntries(new FormData(f)));}catch(e){report(e);}finally{b.disabled=false;}};}
if($('#logout'))$('#logout').onclick=async()=>{try{await request('/api/logout',{});location.replace('/');}catch(e){report(e);}};
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});

submit('#login',async f=>{await request('/api/login',f);location.replace('/');});</script></html>
